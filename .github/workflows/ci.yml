name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit + route tests
        run: npm test
        env:
          AUTH_SECRET: ci-test-secret-not-used-in-production

      # Prisma client generation and a real build are checked separately
      # (they need DATABASE_URL against a live Postgres instance — see
      # docs/CI-NOTE.md for why that's a Neon branch DB, not a local one,
      # and how to wire it in as a repo secret).
